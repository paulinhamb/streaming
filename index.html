<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFinder — Find Where to Stream</title>
  <link rel="stylesheet" href="css/style.css?v=7">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,800&display=swap">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
  <div class="app">

    <!-- Sticky Black Header -->
    <header class="site-header">
      <div class="header-inner">
        <span class="header-logo">STREAMFINDER</span>

        <div class="search-wrap">
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="M21 21l-4.35-4.35"></path>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Search for a movie or series..."
              autocomplete="off"
              spellcheck="false"
            >
            <div id="search-dropdown" class="search-dropdown hidden"></div>
          </div>
        </div>

        <button id="settings-btn" class="header-icon-btn" title="Settings" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content: JS renders welcome, loading, or results here -->
    <main id="content-area" class="content-area"></main>

    <!-- Settings Modal -->
    <dialog id="settings-modal" class="settings-dialog">
      <div class="settings-content">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="settings-close" class="icon-btn" aria-label="Close">&times;</button>
        </div>

        <div class="settings-section">
          <h3>TMDB API Key</h3>
          <p class="settings-help">
            Get a free API key at
            <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org</a>
            (Register &rarr; Settings &rarr; API &rarr; Copy "API Key (v3 auth)")
          </p>
          <input type="text" id="api-key-input" class="settings-input" placeholder="Enter your TMDB API key">
          <p id="settings-status" class="settings-status"></p>
        </div>

        <div class="settings-section">
          <h3>Your Subscriptions</h3>
          <div id="subscribed-list" class="subscribed-list"></div>
          <button id="settings-reset" class="reset-btn">Reset to Defaults</button>
        </div>

        <div class="settings-section">
          <h3>Add Platform</h3>
          <input type="text" id="platform-search" class="settings-input" placeholder="Search for a streaming service...">
          <div id="platform-search-results" class="platform-search-results"></div>
        </div>

        <div class="settings-footer">
          <button id="settings-save" class="primary-btn">Save &amp; Close</button>
        </div>
      </div>
    </dialog>

  </div>

  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
